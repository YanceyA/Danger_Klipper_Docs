# Test config for corexy precise homing: X homes to max and Y to min,
# limited_corexy, no homing retract, uncalibrated
[stepper_x]
step_pin: PC0
dir_pin: PL0
enable_pin: !PA7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 200
position_max: 200
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PG0
run_current: .5
sense_resistor: 0.220
diag1_pin: !PK2

[stepper_y]
step_pin: PC1
dir_pin: !PL1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 200
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA5
diag_pin: PH6
run_current: .5
sense_resistor: 0.110

[stepper_z]
step_pin: PC2
dir_pin: PL2
microsteps: 16
rotation_distance: 8
endstop_pin: ^PB4
position_endstop: 0.5
position_max: 200

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: limited_corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
max_x_accel: 1200
max_y_accel: 900
corexy_precise_homing: True
